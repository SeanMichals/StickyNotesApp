<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StickyNote App</title>
  <script>
    if (!localStorage.getItem('userId')) {
      window.location.href = 'login.html';
    }
  </script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
  
    h1 {
      color: #333;
    }
  
    input, select, button {
      padding: 8px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
  
    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
  
    button:hover {
      background-color: #0056b3;
    }
  
    #notes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
      gap: 20px;
    }
  
    .note {
      width: 200px;
      min-height: 150px;
      background: #fff9c4;
      padding: 15px;
      box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
      border-radius: 8px;
      position: relative;
      text-align: left;
      transition: transform 0.2s ease-in-out;
    }
  
    .note:hover {
      transform: scale(1.03);
    }
  
    .note button {
      background: transparent;
      color: #555;
      border: none;
      font-size: 13px;
      margin-top: 5px;
      padding: 4px;
      cursor: pointer;
    }
  
    .note button:hover {
      text-decoration: underline;
    }
  
    .highlight {
      background-color: #ffecb3 !important;
      border: 2px solid orange;
    }
    
    .highlight-orange {
      background-color: #ffecb3 !important;
      border: 2px solid orange;
    }   

    .highlight-purple {
      background-color: #e1bee7 !important;
      border: 2px solid purple;
    }

    .highlight-green {
      background-color: #c8e6c9 !important;
      border: 2px solid green;
    }

    .highlight-red {
       background-color: #ffcdd2 !important;
      border: 2px solid red;
    }

    .highlight-blue {
      background-color: #bbdefb !important;
      border: 2px solid #2196f3;
    }
  </style>
  
</head>
<body>
  <h1>StickyNote</h1>
  <div style="margin-bottom: 20px;">
    <input id="title" placeholder="Title">
    <input id="desc" placeholder="Description">
    <input type="date" id="date">
    <input type="time" id="time">
    <select id="group">
        <option value="work">Work</option>
        <option value="personal">Personal</option>
        <option value="errand">Errand</option>
        <option value="other">Other</option>
      </select>
    <select id="recurrence">
      <option value="none">None</option>
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
    </select>
    <button onclick="addEvent()">Add Event</button>
  </div>
  <!--SettingBtn-->
  <div style="text-align: right; margin-bottom: 10px;">
    <button id="settingsBtn">⚙️ Settings</button>
    <div id="settingsMenu" style="display: none; position: absolute; right: 20px; background: white; border: 1px solid #ccc; padding: 10px; border-radius: 5px; box-shadow: 2px 2px 6px rgba(0,0,0,0.1);">
      <p style="margin: 0 0 10px;"><strong>Account</strong></p>
      <button onclick="logout()">Logout</button>
      <!-- Future features -->
      <!-- <button onclick="changeTheme()">Dark Mode</button> -->
    </div>
  </div>
  
  <div id="notes"></div>

  <script src="app.js"></script>
</body>
</html>
